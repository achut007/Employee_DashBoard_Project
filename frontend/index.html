<!DOCTYPE html>
<html>
<head>
    <title>BancApp Employee Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f9;
            padding: 40px;
        }
        h1 { color: #2c3e50; }
        input { padding: 8px; margin: 5px; }

        button {
            padding: 10px 20px;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            margin: 5px;
        }
        #btnAdd    { background-color: #007bff; }
        #btnLoad   { background-color: #17a2b8; }
        #btnToggle { background-color: #6c757d; }
        #btnToggle.active { background-color: #fd7e14; }

        table {
            margin-top: 20px;
            border-collapse: collapse;
            width: 85%;
            background: white;
        }
        table, th, td { border: 1px solid #ccc; }
        th, td { padding: 12px; text-align: left; }
        th { background-color: #007bff; color: white; }

        .btn-action {
            padding: 6px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            margin-right: 4px;
        }
        .btn-update { background-color: #fd7e14; }
        .btn-delete { background-color: #dc3545; }
        .btn-action:disabled {
            background-color: #adb5bd;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .edit-input {
            padding: 5px;
            width: 90%;
            border: 1px solid #fd7e14;
            border-radius: 4px;
        }
        .btn-save {
            padding: 6px 12px;
            background-color: #28a745;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            margin-right: 4px;
        }
        .btn-cancel {
            padding: 6px 12px;
            background-color: #6c757d;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
        }
    </style>
</head>
<body>

    <h1>BancApp Employee Dashboard</h1>

    <input type="text" id="name" placeholder="Employee Name">
    <input type="text" id="department" placeholder="Department">
    <br>
    <button id="btnAdd"    onclick="addEmployee()">Add Employee</button>
    <button id="btnLoad"   onclick="loadEmployees()">Load Employees</button>
    <button id="btnToggle" onclick="toggleActions()">Enable Delete / Update</button>

    <table id="employeeTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Department</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

<script>

    let actionsEnabled = false;
    let employees = [];

    // Auto-load on page open
    window.onload = function () {
        loadEmployees();
    };

    async function loadEmployees() {
        const response = await fetch('/api/employees');
        employees = await response.json();
        renderTable();
    }

    function renderTable() {
        const tbody = document.querySelector('#employeeTable tbody');
        tbody.innerHTML = '';

        employees.forEach(emp => {
            const row = document.createElement('tr');
            row.id = `row-${emp.id}`;
            row.innerHTML = `
                <td>${emp.id}</td>
                <td>${emp.name}</td>
                <td>${emp.department}</td>
                <td>
                    <button class="btn-action btn-update"
                        onclick="startEdit(${emp.id})"
                        ${!actionsEnabled ? 'disabled' : ''}>
                        Update
                    </button>
                    <button class="btn-action btn-delete"
                        onclick="deleteEmployee(${emp.id})"
                        ${!actionsEnabled ? 'disabled' : ''}>
                        Delete
                    </button>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    function toggleActions() {
        actionsEnabled = !actionsEnabled;
        const btn = document.getElementById('btnToggle');
        if (actionsEnabled) {
            btn.textContent = 'Disable Delete / Update';
            btn.classList.add('active');
        } else {
            btn.textContent = 'Enable Delete / Update';
            btn.classList.remove('active');
        }
        renderTable();
    }

    async function addEmployee() {
        const name = document.getElementById('name').value.trim();
        const department = document.getElementById('department').value.trim();

        if (!name || !department) {
            alert('Please enter both Employee Name and Department.');
            return;
        }

        await fetch('/api/employees', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, department })
        });

        document.getElementById('name').value = '';
        document.getElementById('department').value = '';
        loadEmployees();
    }

    function startEdit(id) {
        const emp = employees.find(e => e.id === id);
        const row = document.getElementById(`row-${id}`);

        row.innerHTML = `
            <td>${emp.id}</td>
            <td><input class="edit-input" id="editName-${id}" value="${emp.name}"></td>
            <td><input class="edit-input" id="editDept-${id}" value="${emp.department}"></td>
            <td>
                <button class="btn-save" onclick="saveUpdate(${id})">Save</button>
                <button class="btn-cancel" onclick="renderTable()">Cancel</button>
            </td>
        `;
    }

    async function saveUpdate(id) {
        const name = document.getElementById(`editName-${id}`).value.trim();
        const department = document.getElementById(`editDept-${id}`).value.trim();

        if (!name || !department) {
            alert('Name and Department cannot be empty.');
            return;
        }

        await fetch(`/api/employees/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, department })
        });

        loadEmployees();
    }

    async function deleteEmployee(id) {
        if (!confirm('Are you sure you want to delete this employee?')) return;

        await fetch(`/api/employees/${id}`, { method: 'DELETE' });
        loadEmployees();
    }

</script>
</body>
</html>
