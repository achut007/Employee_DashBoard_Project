<!DOCTYPE html>
<html>
<head>

    <title>BancApp Employee Dashboard</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f4f6f9;
            padding: 40px;
        }

        h1 {
            color: #2c3e50;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.85;
        }

        #updateSection {
            display: none;
            margin-top: 20px;
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ffc107;
            width: 500px;
        }

        #updateSection h3 {
            margin-top: 0;
            color: #856404;
        }

        #updateSection input {
            display: block;
            margin: 6px 0;
            width: 90%;
        }

        #updateSection button {
            margin-right: 8px;
        }

        table {
            margin-top: 20px;
            border-collapse: collapse;
            width: 80%;
            background: white;
        }

        table, th, td {
            border: 1px solid #ccc;
        }

        th, td {
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        .btn-delete {
            padding: 6px 12px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 4px;
        }

        .btn-edit {
            padding: 6px 12px;
            background-color: #fd7e14;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-save {
            background-color: #28a745;
        }

        .btn-cancel {
            background-color: #6c757d;
        }

    </style>

</head>

<body>

    <h1>BancApp Employee Dashboard</h1>

    <!-- Add Employee Form -->
    <input type="text" id="name" placeholder="Employee Name">
    <input type="text" id="department" placeholder="Department">
    <br>
    <button onclick="addEmployee()">Add Employee</button>
    <button onclick="loadEmployees()">Load Employees</button>

    <!-- Update Employee Section (shown when Edit is clicked) -->
    <div id="updateSection">
        <h3>✏️ Edit Employee</h3>
        <input type="text" id="editName" placeholder="New Name">
        <input type="text" id="editDepartment" placeholder="New Department">
        <input type="hidden" id="editId">
        <br>
        <button class="btn-save" onclick="saveUpdate()">Save Changes</button>
        <button class="btn-cancel" onclick="cancelUpdate()">Cancel</button>
    </div>

    <!-- Employee Table -->
    <table id="employeeTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Department</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

<script>

async function loadEmployees() {

    const response = await fetch('/api/employees');
    const data = await response.json();

    const tbody = document.querySelector('#employeeTable tbody');
    tbody.innerHTML = '';

    data.forEach(emp => {
        const row = `
            <tr id="row-${emp.id}">
                <td>${emp.id}</td>
                <td>${emp.name}</td>
                <td>${emp.department}</td>
                <td>
                    <button class="btn-edit" onclick="editEmployee(${emp.id}, '${emp.name}', '${emp.department}')">Edit</button>
                    <button class="btn-delete" onclick="deleteEmployee(${emp.id})">Delete</button>
                </td>
            </tr>
        `;
        tbody.innerHTML += row;
    });
}

async function addEmployee() {

    const name = document.getElementById('name').value.trim();
    const department = document.getElementById('department').value.trim();

    if (!name || !department) {
        alert('Please enter both name and department.');
        return;
    }

    await fetch('/api/employees', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, department })
    });

    document.getElementById('name').value = '';
    document.getElementById('department').value = '';

    loadEmployees();
}

function editEmployee(id, name, department) {
    document.getElementById('editId').value = id;
    document.getElementById('editName').value = name;
    document.getElementById('editDepartment').value = department;
    document.getElementById('updateSection').style.display = 'block';
    document.getElementById('updateSection').scrollIntoView({ behavior: 'smooth' });
}

async function saveUpdate() {

    const id = document.getElementById('editId').value;
    const name = document.getElementById('editName').value.trim();
    const department = document.getElementById('editDepartment').value.trim();

    if (!name || !department) {
        alert('Please enter both name and department.');
        return;
    }

    await fetch(`/api/employees/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, department })
    });

    cancelUpdate();
    loadEmployees();
}

function cancelUpdate() {
    document.getElementById('updateSection').style.display = 'none';
    document.getElementById('editName').value = '';
    document.getElementById('editDepartment').value = '';
    document.getElementById('editId').value = '';
}

async function deleteEmployee(id) {

    if (!confirm('Are you sure you want to delete this employee?')) return;

    await fetch(`/api/employees/${id}`, {
        method: 'DELETE'
    });

    loadEmployees();
}

// Auto-load on page open
loadEmployees();

</script>

</body>
</html>
